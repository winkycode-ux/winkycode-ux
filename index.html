<style>
:root{--bg:#09070b;--text:#fff;--muted:rgba(255,255,255,.58);--line:rgba(255,255,255,.11);--rose:#ff9bbb;--violet:#a78bfa;--blue:#7cc5ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100svh;overflow-x:hidden;background:radial-gradient(720px 520px at 50% -12%,rgba(255,155,187,.14),transparent 58%),radial-gradient(520px 420px at 0% 100%,rgba(167,139,250,.10),transparent 65%),linear-gradient(180deg,#0d0a10 0%,#09070b 52%,#070609 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;background-image:radial-gradient(rgba(255,255,255,.28) .55px,transparent .55px);background-size:24px 24px;mask-image:linear-gradient(to bottom,#000,transparent 72%)}
a{color:inherit;text-decoration:none}.wrap{width:min(480px,calc(100% - 20px));margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 0 max(28px,env(safe-area-inset-bottom))}
.hero{position:relative;text-align:center;padding:30px 18px 25px;border:1px solid var(--line);border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));box-shadow:0 28px 75px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden}.hero:after{content:"";position:absolute;left:50%;top:-100px;transform:translateX(-50%);width:260px;height:180px;background:radial-gradient(ellipse,rgba(255,155,187,.22),transparent 68%);filter:blur(5px);pointer-events:none}
.avatar{position:relative;z-index:1;width:112px;height:112px;margin:0 auto 18px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--rose),var(--violet),var(--blue));box-shadow:0 0 0 7px rgba(255,255,255,.025),0 20px 60px rgba(167,139,250,.20)}
.avatar img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;object-position:50% 22%;border:4px solid #0b080d}
h1{position:relative;z-index:1;margin:0;font-size:34px;letter-spacing:.05em;font-weight:760}.tag{position:relative;z-index:1;margin-top:8px;color:var(--muted);font-size:12px;letter-spacing:.18em;text-transform:uppercase}.bio{position:relative;z-index:1;margin:16px auto 0;max-width:330px;font-size:14px;line-height:1.55;color:rgba(255,255,255,.82)}
.links{display:grid;gap:12px;margin-top:14px}.link{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-height:88px;padding:15px 16px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));box-shadow:0 18px 48px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .16s ease,border-color .16s ease,background .16s ease}.link:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.2);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04))}.link:active{transform:scale(.986)}
.icon{width:54px;height:54px;flex:0 0 auto;border-radius:18px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05)}.icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.private .icon{color:#d8cfff;background:linear-gradient(145deg,rgba(167,139,250,.24),rgba(167,139,250,.07))}.telegram .icon{color:#a8d8ff;background:linear-gradient(145deg,rgba(124,197,255,.23),rgba(124,197,255,.06))}.tiktok .icon{color:#ffc0d4;background:linear-gradient(145deg,rgba(255,155,187,.20),rgba(255,155,187,.06))}
.meta{min-width:0;flex:1}.meta strong{display:block;font-size:17px;font-weight:730;margin-bottom:5px}.meta span{display:block;font-size:12.5px;line-height:1.35;color:var(--muted)}.go{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.035);font-size:17px;color:rgba(255,255,255,.75)}
.disabled{opacity:.66;cursor:default}.disabled:hover,.disabled:active{transform:none}.badge{font-size:9.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:#ffd3e2;padding:7px 9px;border-radius:999px;border:1px solid rgba(255,155,187,.24);background:rgba(255,155,187,.08)}
.footer{text-align:center;padding:24px 4px 4px;color:rgba(255,255,255,.28);font-size:9px;letter-spacing:.20em;text-transform:uppercase}
@media(max-width:420px){.wrap{width:min(100%,calc(100% - 14px));padding-top:max(10px,env(safe-area-inset-top))}.hero{border-radius:28px;padding:26px 15px 22px}.avatar{width:102px;height:102px}h1{font-size:30px}.link{min-height:82px;border-radius:23px;padding:13px}.icon{width:50px;height:50px;border-radius:17px}.meta strong{font-size:16px}.meta span{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</html>
