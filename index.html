<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0710">
<meta name="description" content="SONIA — official links">
<title>SONIA — links</title>
<style>
:root{
  --bg:#08070b;
  --text:#fff;
  --muted:rgba(255,255,255,.62);
  --line:rgba(255,255,255,.12);
  --glass:rgba(255,255,255,.075);
  --glass2:rgba(255,255,255,.035);
  --pink:#ff7caf;
  --violet:#9b7cff;
  --blue:#70b4ff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100svh;overflow-x:hidden;background:
  radial-gradient(760px 520px at -5% -4%,rgba(155,124,255,.21),transparent 62%),
  radial-gradient(720px 520px at 104% 92%,rgba(255,124,175,.17),transparent 64%),
  linear-gradient(180deg,#0d0912 0%,#08070b 48%,#07070a 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(rgba(255,255,255,.22) .65px,transparent .65px);background-size:22px 22px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 68%)}
a{color:inherit;text-decoration:none}
.shell{width:min(500px,calc(100% - 24px));margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 0 max(30px,env(safe-area-inset-bottom))}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:34px;padding:28px 20px 24px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));box-shadow:0 28px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hero:before{content:"";position:absolute;width:250px;height:250px;left:50%;top:-155px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,124,175,.34),rgba(155,124,255,.19) 42%,transparent 70%);filter:blur(2px)}
.avatar{position:relative;width:104px;height:104px;margin:2px auto 17px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#ff9fbd 0%,#b58bff 52%,#72bcff 100%);box-shadow:0 0 0 6px rgba(255,255,255,.025),0 18px 50px rgba(155,124,255,.20)}
.avatar:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.avatar-inner{height:100%;width:100%;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#211726,#0f0d13 68%);border:4px solid #0c0910;font-family:Georgia,"Times New Roman",serif;font-size:38px;font-style:italic;font-weight:500}
h1{position:relative;margin:0;font-size:31px;line-height:1;font-weight:780;letter-spacing:.015em}.verified{display:inline-grid;place-items:center;width:19px;height:19px;margin-left:5px;vertical-align:2px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--blue));font-size:11px}
.sub{position:relative;margin-top:9px;color:var(--muted);font-size:13px;letter-spacing:.03em}.bio{position:relative;margin:16px auto 0;max-width:330px;color:rgba(255,255,255,.82);font-size:14px;line-height:1.55}
.links{display:grid;gap:11px;margin-top:14px}.link{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-height:82px;padding:14px 15px;border-radius:25px;border:1px solid var(--line);background:linear-gradient(180deg,var(--glass),var(--glass2));box-shadow:0 18px 42px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .16s ease,border-color .16s ease,background .16s ease}
.link:before{content:"";position:absolute;right:-36px;top:-44px;width:130px;height:130px;border-radius:50%;filter:blur(4px);opacity:.26}.link:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(255,255,255,.095),rgba(255,255,255,.045))}.link:active{transform:scale(.985)}
.bot:before{background:radial-gradient(circle,var(--violet),transparent 67%)}.channel:before{background:radial-gradient(circle,var(--blue),transparent 67%)}.tiktok:before{background:radial-gradient(circle,var(--pink),transparent 67%)}
.icon{position:relative;width:51px;height:51px;flex:0 0 auto;border-radius:17px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.bot .icon{color:#c9bfff;background:linear-gradient(145deg,rgba(155,124,255,.24),rgba(155,124,255,.07))}.channel .icon{color:#9ccfff;background:linear-gradient(145deg,rgba(112,180,255,.24),rgba(112,180,255,.07))}.tiktok .icon{color:#ffb2cd;background:linear-gradient(145deg,rgba(255,124,175,.21),rgba(255,124,175,.06))}
.meta{position:relative;min-width:0;flex:1}.meta strong{display:block;font-size:16px;font-weight:730;margin-bottom:5px}.meta span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.go{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.035);font-size:17px;color:rgba(255,255,255,.72)}
.badge{position:relative;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ffd3e2;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,124,175,.22);background:rgba(255,124,175,.08)}.disabled{opacity:.73;cursor:default}.disabled:hover,.disabled:active{transform:none}
.mini{display:flex;justify-content:center;gap:7px;margin-top:17px}.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.16)}.dot:nth-child(2){background:rgba(255,124,175,.62);box-shadow:0 0 14px rgba(255,124,175,.45)}
.footer{text-align:center;padding:23px 4px 4px;color:rgba(255,255,255,.34);font-size:10px;letter-spacing:.17em;text-transform:uppercase}
@media(max-width:420px){.shell{width:min(100%,calc(100% - 16px));padding-top:max(12px,env(safe-area-inset-top))}.hero{border-radius:28px;padding:24px 16px 21px}.avatar{width:94px;height:94px}.avatar-inner{font-size:34px}h1{font-size:28px}.link{min-height:77px;border-radius:22px;padding:13px}.icon{width:48px;height:48px;border-radius:16px}.meta strong{font-size:15px}.meta span{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="shell">
  <section class="hero">
    <div class="avatar"><div class="avatar-inner">S</div></div>
    <h1>SONIA <span class="verified">✓</span></h1>
    <div class="sub">official links</div>
    <div class="bio">Мои актуальные ссылки в одном месте ♡</div>
  </section>

  <section class="links">
    <a class="link bot" href="https://t.me/Sonilovv_private_bot" target="_blank" rel="noopener noreferrer">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 3v3M8.5 6.5h7A3.5 3.5 0 0 1 19 10v5a3.5 3.5 0 0 1-3.5 3.5h-7A3.5 3.5 0 0 1 5 15v-5a3.5 3.5 0 0 1 3.5-3.5Z"/><path d="M9 12h.01M15 12h.01M9 15.5h6"/></svg></div>
      <div class="meta"><strong>Private bot</strong><span>Личный бот Сони</span></div>
      <div class="go">↗</div>
    </a>

    <a class="link channel" href="https://t.me/+KLAriHKeULwyNTli" target="_blank" rel="noopener noreferrer">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="m21 4-8.5 16-3.6-6.1L3 10.8 21 4Z"/><path d="m8.9 13.9 4.1-3.4"/></svg></div>
      <div class="meta"><strong>Telegram</strong><span>Закрытый канал</span></div>
      <div class="go">↗</div>
    </a>

    <div class="link tiktok disabled" aria-disabled="true">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M14 4v10.2a4.2 4.2 0 1 1-3.2-4.1"/><path d="M14 4c1.1 2.5 2.8 3.7 5 3.9"/></svg></div>
      <div class="meta"><strong>TikTok</strong><span>Добавим ссылку позже</span></div>
      <div class="badge">скоро</div>
    </div>
  </section>

  <div class="mini"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <footer class="footer">SONIA • 2026</footer>
</main>
</body>
</html>
